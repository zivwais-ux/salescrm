<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>ניהול מכירות · גדות מסופים</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233b4ee0'/><path d='M9 21h14M12 21V12M16 21V9M20 21v-6' stroke='white' stroke-width='2.2' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // נקבע לפני הציור הראשון כדי שלא תהיה הבזקה של המצב הלא נכון.
    try {
      var saved = localStorage.getItem("gadot_theme");
      var dark = saved ? saved === "dark"
                       : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    } catch (e) { document.documentElement.dataset.theme = "light"; }
  </script>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar">
      <button class="btn btn-icon btn-ghost only-mobile" id="menu-btn" aria-label="תפריט"></button>
      <div>
        <div class="page-title" id="page-title">לוח בקרה</div>
        <div class="page-sub" id="page-sub"></div>
      </div>
      <div class="topbar-tools" id="topbar-tools"></div>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<div id="drawer-root"></div>
<div id="palette-root"></div>
<div class="toast-stack" id="toast-stack"></div>

<script src="data/dataset.js"></script>
<script src="js/config.js"></script>
<script src="js/format.js"></script>
<script src="js/ui.js"></script>
<script src="js/store.js"></script>
<script src="js/metrics.js"></script>
<script src="js/charts.js"></script>
<script src="js/excel.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/customers.js"></script>
<script src="js/views/grid.js"></script>
<script src="js/views/activity.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
