<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#090c10" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BENY">
  <title>BENY · ניהול מכירות</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23335ed4'/><text x='16' y='22' font-size='17' font-family='Helvetica,Arial,sans-serif' font-weight='700' fill='white' text-anchor='middle'>B</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // נקבע לפני הציור הראשון, אחרת יש הבזק של המצב הלא נכון.
    (function () {
      var pref = "auto";
      try { pref = localStorage.getItem("beny_theme") || "auto"; } catch (e) { /* חסום */ }
      var dark = pref === "dark" || (pref === "auto"
        && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="view" id="view"></main>
  </div>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="chat-root"></div>
<div id="drawer-root"></div>
<div id="palette-root"></div>
<div class="toast-stack" id="toast-stack"></div>

<script src="data/dataset.js"></script>
<script src="js/config.js"></script>
<script src="js/format.js"></script>
<script src="js/ui.js"></script>
<script src="js/store.js"></script>
<script src="js/metrics.js"></script>
<script src="js/charts.js"></script>
<script src="js/assistant.js"></script>
<script src="js/excel.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/customers.js"></script>
<script src="js/views/grid.js"></script>
<script src="js/views/activity.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
