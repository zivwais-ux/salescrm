<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ניהול מכירות · בני ויסמן</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231d4ed8'/><text x='16' y='23' font-size='19' font-family='sans-serif' fill='white' text-anchor='middle'>%E2%82%AA</text></svg>">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">₪</span>
    <div>
      <h1>ניהול מכירות</h1>
      <p id="brand-sub">גדות מסופים · סניף 06</p>
    </div>
  </div>

  <div class="topbar-controls">
    <label class="field">
      <span>שנה</span>
      <select id="year-select"></select>
    </label>
    <label class="field">
      <span>סוכן</span>
      <select id="agent-select"></select>
    </label>
    <button class="btn" id="btn-export">ייצוא לאקסל</button>
    <span class="sync-pill" id="sync-pill" title="מצב שמירה">מקומי</span>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab is-active" data-view="dashboard">לוח בקרה</button>
  <button class="tab" data-view="customers">לקוחות</button>
  <button class="tab" data-view="grid">טבלת חודשים</button>
  <button class="tab" data-view="activity">משימות ופעילות</button>
  <button class="tab" data-view="settings">הגדרות וסנכרון</button>
</nav>

<main id="view"></main>

<aside class="drawer" id="drawer" hidden>
  <div class="drawer-backdrop" data-close-drawer></div>
  <section class="drawer-panel" id="drawer-panel" role="dialog" aria-modal="true"></section>
</aside>

<div class="toast" id="toast" hidden></div>

<script src="data/dataset.js"></script>
<script src="js/config.js"></script>
<script src="js/format.js"></script>
<script src="js/store.js"></script>
<script src="js/metrics.js"></script>
<script src="js/charts.js"></script>
<script src="js/excel.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/customers.js"></script>
<script src="js/views/grid.js"></script>
<script src="js/views/activity.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
